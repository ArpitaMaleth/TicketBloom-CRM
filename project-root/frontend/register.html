<!DOCTYPE html>
<html>
<head>
    <title>Register - TicketBloom</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h2>🌸 Register</h2>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <select id="role">
            <option value="customer">Customer</option>
            <option value="agent">Agent</option>
        </select>

        <button type="submit">Register</button>
    </form>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    try {
        const res = await fetch('http://localhost:5000/api/auth/register', {        
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role })
        });

        if (res.status === 200 || res.status === 201) {
            alert("Registered successfully!");
            window.location.href = "login.html";
        } else {
            // Read as text first to avoid JSON parse errors
            const textResponse = await res.text();
            try {
                const data = JSON.parse(textResponse);
                alert(data.msg || "Registration Error");
            } catch (parseError) {
                console.error("Server Error:", textResponse);
                alert("Server Error! Check if MongoDB is running and connected.");
            }
        }
    } catch (err) {
        console.error("Network Error:", err);
        alert("Failed to connect to the backend! Is your backend server running?");
    }
});
</script>

</body>
</html>
